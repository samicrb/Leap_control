# =============================================================================
# Doosan Gesture Demo - runtime configuration
#
# Units: mm, mm/s, deg, deg/s, mm/s^2, deg/s^2, seconds.
# Angles use the Doosan ZYZ' (W,P,R) convention - same numbers the pendant
# shows for posx [x,y,z,W,P,R].
#
# Sections below are organised by USAGE (what you tune to change a behaviour).
# The parser also accepts the historical flat keys (motion.position_scale,
# robot.micro_command_rate_hz, ...): they are equivalent. See
# docs/CLAUDE_HANDOFF.md and src/config/Config.cpp for the alias table.
#
# Each parameter is annotated with:
#   - Runtime tunable: yes / no  (yes => can be hot-reloaded while running)
#   - Unit
#   - Recommended safe range
#   - Effect when increasing / decreasing
# =============================================================================


# =============================================================================
# [leap]
# Leap Motion (Gemini 6.2.0) hand-tracking thresholds. Tracking quality
# tweaks; these are STARTUP-only because they are read once at construction
# of the GestureInterpreter.
# =============================================================================
[leap]
# Runtime tunable: no
# Unit: -   Range: 0.0..1.0
# Below this Leap confidence value a hand is treated as missing.
min_confidence        = 0.3
# Runtime tunable: no
# Unit: s   Range: 0.05..0.5
# How long a hand may flicker out before we declare it lost.
hand_loss_timeout_s   = 0.15
# Runtime tunable: no
# Unit: s   Range: 0.05..0.5
# Debounce: posture must be held this long before triggering a state entry.
posture_hold_s        = 0.10
# Runtime tunable: no
# Unit: -   Range: 0.5..0.95
# Hysteresis for posture detection. Hand must cross all the way through
# both thresholds to flip Open <-> Closed (prevents chattering).
grab_closed_threshold = 0.85
grab_open_threshold   = 0.30


# =============================================================================
# [robot_connection]
# Initial DRFL link parameters. STARTUP-only - cannot be changed at runtime
# (DRFL doesn't support reconnection without restart).
# =============================================================================
[robot_connection]
# Runtime tunable: no
ip                = 192.168.1.25
port              = 12345
model             = M1013
# Runtime tunable: no
# Unit: s   Range: 1..30
# Fail-safe: refuse to start if robot does not connect within this many seconds.
connect_timeout_s = 5.0
# Runtime tunable: no
# When true, skip the initial blocking movel-to-safe-pose. Set this if the
# controller trips a SAFE_STOP during the home approach (e.g. the safe pose
# is inside a controller-side safety zone, or the move triggers collision
# detection). The demo then operates from whatever pose the robot is in.
# Kept for backward compatibility - the canonical knobs are the two
# return_home_* flags below.
skip_move_home = false

# Runtime tunable: no
# DEMO-SAFE DEFAULT: false. The robot will NOT auto-move home at startup.
# Effective rule: move_home = return_home_on_start AND NOT skip_move_home.
# Set to true ONLY when you want the robot to plan a movel to safe_pose.*
# after engage().
return_home_on_start    = false
# Runtime tunable: no
# DEMO-SAFE DEFAULT: false. The robot will NOT auto-move home on shutdown.
# Set to true if your operator wants the robot parked at safe_pose.* when
# the demo exits. Disabled by default so a CTRL+C never triggers a
# planned motion.
return_home_on_shutdown = false


# =============================================================================
# [safety]
# Controller-level safety knobs. STARTUP-only.
# =============================================================================
[safety]
# Runtime tunable: no
# Unit: 0..100
# Collision detection sensitivity. 0 disables - use for bring-up when gentle
# motions trip phantom collision stops because the payload/TCP isn't yet
# declared on the controller. Re-enable (50-75) for production.
collision_sensitivity = 0
# Runtime tunable: no
# 0 = AVOID  (blend through; demo default)
# 1 = STOP   (controller default - trips alarm 3205)
# 2 = VEL    (reduce velocity near singularity)
singularity_handling = 0
# Runtime tunable: no
# Use joint-space movejx instead of Cartesian movel for the initial home
# approach. movejx is immune to Cartesian path singularities.
home_use_movejx = true
# Runtime tunable: no
# Auto-reset latched SAFE_STOP / SAFE_OFF at start of each engage(). A
# SAFE_STOP from a previous run stays latched on the controller and looks
# like a "mastering lost" condition.
auto_reset_safety = true


# =============================================================================
# [motion_mapping]
# How the Leap hand displacement is converted to a robot command.
# Effective hand->robot gain (in pursuit mode) is:
#   position_scale * micro_pursuit.hand_to_robot_ratio
# (default 0.90 * 0.60 = 0.54 => 5.4 mm robot motion per 10 mm hand motion).
# =============================================================================
[motion_mapping]
# Runtime tunable: yes
# Unit: -   Range: 0.1..2.0
# Higher value = more robot motion per mm of hand motion.
# Lower value = finer, slower control.
position_scale          = 0.90
# Runtime tunable: yes
# Unit: -   Range: 0.1..2.0
# Same idea on the orientation axis.
orientation_scale       = 0.45
# Runtime tunable: yes
# Unit: mm  Range: 0.0..20.0
# Dead-zone applied per axis on hand displacement before any motion is
# commanded. Higher value = more stable when standing still, less responsive.
position_deadzone_mm    = 1.5
# Runtime tunable: yes
# Unit: deg Range: 0.0..10.0
orientation_deadzone_deg = 1.5
# Runtime tunable: no  (read once when building the state machine mapping)
# Axis sign flips for venue calibration. +1 or -1.
sign_x  = 1
sign_y  = 1
sign_z  = 1
sign_rx = 1
sign_ry = 1
sign_rz = 1


# =============================================================================
# [motion_smoothing]
# Low-pass filter applied to the raw Leap palm samples (gesture layer).
# Affects hand_filtered_* columns in the motion CSV. Independent of the
# velocity-smoothing layer in [velocity_filter].
# =============================================================================
[motion_smoothing]
# Runtime tunable: yes
# Unit: -   Range: 0.0..0.95
# 0 = no smoothing (raw samples, more jitter)
# Higher = smoother but laggier. Useful values: 0.1 .. 0.3.
smoothing_alpha = 0.14


# =============================================================================
# [motion_backend]   - selects the per-command motion primitive.
#
# Two backends live side-by-side:
#   amovel : discrete planned segments with optional blending, pursuit-
#            target advance, optional velocity-smoothing tail. Existing
#            behaviour. Knobs in [micro_pursuit] / [robot_command] /
#            [blending] / [velocity_filter].
#   servol : continuous SERVO-L task-space target update. The controller
#            follows the most recent target delivered, bounded by
#            servol.lin_vel / servol.ang_vel / servol.lin_acc /
#            servol.ang_acc. Knobs in [servol]. No blending, no backlog
#            guard, no segment chaining.
#
# Switching backends mid-run is unsafe (a servol stream colliding with
# an in-flight amovel reliably trips alarm 5.7056). The Application
# defers a hot-reload of motion_backend.type until the SM is in a
# passive state.
# =============================================================================
[motion_backend]
# Runtime tunable: yes (DEFERRED until SM returns to READY/IDLE).
# Valid values: amovel, servol.
type           = servol
# Runtime tunable: yes. Set to false to refuse a servol selection on
# startup or hot-reload, regardless of motion_backend.type.
allow_servol   = true
# Runtime tunable: yes. Same for amovel.
allow_amovel   = true


# =============================================================================
# [servol]
# Continuous Doosan SERVO-L target update. Each tick the backend
# bounds the target step by Euclidean vector norm (NOT per-axis),
# then emits servol(target, [lin_vel,ang_vel], [lin_acc,ang_acc], time)
# at the configured rate. Skip reasons recorded in the motion CSV:
# scheduler, arrival_band, tracking_invalid, robot_refused, not_ready.
# =============================================================================
[servol]
# Runtime tunable: yes
enabled               = true
# Runtime tunable: yes
# Unit: Hz  Range: 1.0..50.0  (conservative ceiling - the Doosan A/M
# series accept higher rates but field-validate first)
command_rate_hz       = 20.0
# Runtime tunable: yes
# Unit: s   Hard lower bound between consecutive servol calls.
min_period_s          = 0.050

# Doosan servol velocity / acceleration caps. servol takes:
#   vel = [linear mm/s, angular deg/s]
#   acc = [linear mm/s^2, angular deg/s^2]
# Runtime tunable: yes
lin_vel               = 80.0
ang_vel               = 20.0
lin_acc               = 300.0
ang_acc               = 80.0

# Runtime tunable: yes
# Unit: s   <= 0 lets the controller pick.
# servol(target, vel, acc, time) reach-time hint.
time_s                = 0.08

# Vector-norm caps on the per-command step. NOT per-axis (the previous
# per-axis 22 mm cap produced ~38 mm vector steps on diagonals).
# Runtime tunable: yes
max_step_xyz_mm       = 6.0
max_step_rot_deg      = 1.5

# Skip the command (target unchanged on the controller side) when the
# step is below these thresholds. Avoids dribbling micro-corrections.
# Runtime tunable: yes
arrival_band_xyz_mm   = 1.0
arrival_band_rot_deg  = 0.3

# Tracking safety
# Runtime tunable: yes
# When true AND hold_last_target_on_tracking_loss = false, the backend
# stops emitting on tracking loss (controller decelerates to a stop).
stop_on_tracking_loss             = true
# Runtime tunable: yes
# When true, on tracking loss the backend emits servol(last_target,...)
# at the same rate so the controller HOLDS the last commanded pose
# instead of decelerating. This is the recommended demo default - no
# jumps, no drift, smooth resume on recovery.
hold_last_target_on_tracking_loss = true
# Runtime tunable: yes
# Unit: s   The motion-backend's tracking gate. The Application also
# enforces the global [tracking_loss_tolerance] gate; this one is the
# servol-specific override used when both are present.
tracking_frame_timeout_s          = 0.15
# Runtime tunable: yes
# Unit: s   Required continuous validity time before re-emitting after
# a brief loss recovers.
tracking_recovery_time_s          = 0.05

# Runtime tunable: yes
# When true, every emitted servol command logs a [DEBUG] line with the
# target pose, step magnitudes, and elapsed time.
log_servol_diagnostics            = true


# =============================================================================
# [micro_pursuit]
# High-level pursuit/lookahead controller. The hand defines an ABSOLUTE
# desired target relative to the pose captured on active-mode entry; the
# robot follows it via bounded pursuit steps. Disable to fall back to the
# legacy incremental integrator (kept for A/B testing only).
# =============================================================================
[micro_pursuit]
# Runtime tunable: yes
# When false: legacy incremental integrator; ignores most other knobs in this
# section. Switch back on for normal operation.
enabled              = true
# Runtime tunable: yes
# Unit: -   Range: 0.1..2.0
# Hand-to-robot motion ratio in pursuit mode. Combined with motion_mapping.
# position_scale, this is the effective hand->robot gain.
hand_to_robot_ratio  = 0.60
# Runtime tunable: yes
# Unit: mm  Range: 0.0..50.0
# Minimum pursuit step. Below the arrival band, no command is issued.
# Smaller min_step keeps the controller from forcing a too-large move on
# tiny errors.
min_step_xyz_mm      = 2.0
# Runtime tunable: yes
# Unit: mm  Range: 0.0..50.0
# Maximum pursuit step (Euclidean XYZ norm - NOT per-axis).
# Conservative ~12 mm matches v^2/a = 90^2/450 ~ 18 mm and keeps each
# segment well-shaped at 12 Hz emission.
max_step_xyz_mm      = 12.0
# Runtime tunable: yes
# Unit: deg Range: 0.0..30.0
min_step_rot_deg     = 0.5
max_step_rot_deg     = 2.5
# Runtime tunable: yes
# Unit: mm  Range: 0.0..20.0
# Below this XYZ error norm the controller commits to "arrived" and
# stops issuing. A slightly larger band reduces dribbling.
arrival_band_xyz_mm  = 2.5
# Runtime tunable: yes
# Unit: deg Range: 0.0..10.0
arrival_band_rot_deg = 0.7
# Runtime tunable: yes
# Unit: s   Range: 0.0..2.0
# After tracking is lost, refuse to update the pursuit target until
# tracking has been continuously valid for this duration. Prevents the
# POSITION -> RECENTER -> POSITION chatter caused by transient confidence
# drops.
tracking_recovery_time_s = 0.30


# =============================================================================
# [robot_command]
# Per-amovel motion profile and scheduler. The scheduler caps the issue rate
# so DRFL never sees more than micro_command_rate_hz commands per second.
# =============================================================================
[robot_command]
# Runtime tunable: yes
# Unit: Hz  Range: 1.0..50.0
# Higher = more reactive but more DRFL traffic. 12 Hz with the backlog
# guard gives cleanly timed, non-queued segments on M1013.
micro_command_rate_hz = 12.0
# Runtime tunable: yes
# Unit: s   Range: 0.02..0.5
# Hard lower bound between consecutive amovel calls.
micro_min_period_s    = 0.083
# Runtime tunable: yes
# Unit: mm/s  Range: 10..500
# Higher = faster individual segments, potentially more jerk at boundaries.
# Lower = smoother but slower. Tuned conservatively for A-series style.
micro_lin_vel         = 90.0
# Runtime tunable: yes
# Unit: deg/s Range: 5..180
micro_ang_vel         = 22.0
# Runtime tunable: yes
# Unit: mm/s^2 Range: 50..5000
# Higher accel = more aggressive start/stop on each segment, sharper feel.
# Lower = silkier but each segment takes longer. Pairs with vel above so
# segment shape ~ v^2/a ~ 18 mm <= max_step_xyz_mm.
micro_lin_acc         = 450.0
# Runtime tunable: yes
# Unit: deg/s^2 Range: 10..1500
micro_ang_acc         = 120.0
# --- Command backlog guard -----------------------------------------------
# Runtime tunable: yes
# When true, the scheduler refuses to enqueue a new amovel until at least
# min_motion_completion_ratio of the previous segment's expected execution
# time has elapsed. Prevents micro-bursts of commands while the robot is
# still finishing the previous move.
prevent_command_backlog     = true
# Runtime tunable: yes
# Range: 0.0..1.5
# 0.0 disables the guard entirely (equivalent to prevent_command_backlog=false).
# 1.0 waits the FULL estimated execution time (very conservative).
# 0.6 = wait for 60% of the estimate before sending the next command.
min_motion_completion_ratio = 0.60
# Runtime tunable: yes
# Unit: s   Range: 0.01..5.0
# Hard upper bound; release the guard if waiting longer than this.
max_pending_command_age_s   = 0.35


# =============================================================================
# [blending]
# Inter-segment blending. Critical for smoothness across chained amovels.
# Disable to revert to the previous non-blended behaviour.
# A blended motion must NEVER be followed by a non-motion DRFL command
# (mwait, stop, getCurrentPose) - the Application enforces this.
# =============================================================================
[blending]
# Runtime tunable: yes
enabled   = true
# Runtime tunable: yes
# Unit: mm  Range: 0.0..50.0
# Larger radius = smoother, less geometric accuracy on the path.
# 6 mm pairs well with max_step_xyz_mm = 12 mm: blend ~ 0.5 * segment.
radius_mm = 6.0
# Runtime tunable: yes
# duplicate | override
# DUPLICATE: keep the previous segment's velocity profile on entry.
# OVERRIDE:  use the new segment's profile immediately.
type      = duplicate


# =============================================================================
# [velocity_filter]
# Velocity-smoothing layer on top of the pursuit controller. When enabled,
# the controller derives a desired velocity from the pose error, low-pass
# filters it, then applies hard accel and jerk limits before integrating to
# the next amovel target. Result: a continuous velocity profile across
# segments (visibly less jerky).
# =============================================================================
[velocity_filter]
# Runtime tunable: yes
# When false: use the pure position-step pursuit controller (this is the
# current demo default - the priority is reliable amovel motion).
# When true:  enable the LPF + accel/jerk-limited velocity-smoothing
# layer on top of the pursuit step. Re-enable when you want to A/B the
# smoother feel against the bare pursuit path.
enabled         = false
# Runtime tunable: yes  (currently startup-only; see whitelist)
# Unit: -   Range: 0.0..1.0
# Low-pass alpha. 1 = no filtering, 0 = frozen.
# 0.25 is heavier filtering than the previous 0.35 default -> smoother
# velocity tracking at the cost of slightly more latency.
alpha           = 0.25
# Runtime tunable: yes  (currently startup-only; see whitelist)
# Unit: mm/s^3 Range: 100..10000
# Hard jerk cap on linear velocity. Smaller = silkier accel transitions.
max_jerk_xyz    = 1500.0
# Runtime tunable: yes  (currently startup-only; see whitelist)
# Unit: deg/s^3 Range: 50..3000
max_jerk_rot    = 400.0
# Runtime tunable: yes  (currently startup-only; see whitelist)
# Unit: mm/s   Range: 0.0..50.0
# Below this band the filtered velocity is zeroed and amovel is skipped.
deadband_mm_s   = 1.5
# Runtime tunable: yes  (currently startup-only; see whitelist)
# Unit: s   Range: 0.05..1.0
# On active->passive transition the controller drives velocity to zero over
# this duration. NO speedl, NO stopMotion in the active tail.
stop_ramp_time_s = 0.22


# =============================================================================
# [tracking_loss_tolerance]
# Demo-mode tolerance for brief Leap dropouts. When the hand is briefly
# lost (operator gestured outside the cone, finger occlusion, frame
# drop), the system enters an INTERNAL "tracking_hold" - target frozen,
# velocity ramped to zero, NO transition to FAULT and NO lift-and-show
# recovery required. On recovery the gesture reference is re-anchored
# to the current robot/hand pose so the robot does NOT jump.
#
# When this whole section is disabled, the controller falls back to the
# previous strict behaviour: SM goes to FAULT on RightHandLost /
# LeftHandLost, the operator has to remove and re-present both hands
# before motion resumes.
# =============================================================================
[tracking_loss_tolerance]
# Runtime tunable: yes
# Master switch. Disable to compare strict (FAULT) vs demo-tolerant.
enabled                      = true
# Runtime tunable: yes
# Unit: s   Range: 0.0..1.0
# A tick whose age since the last fresh+present right-hand sample is
# below this threshold is treated as if it had fresh tracking.
# Catches single dropped 60 Hz frames without invalidating tracking.
frame_timeout_s              = 0.15
# Runtime tunable: yes
# Unit: s   Range: 0.0..5.0
# Maximum tolerated loss duration. Beyond this, escalate to strict
# behaviour (existing FAULT path).
brief_loss_timeout_s         = 0.50
# Runtime tunable: yes
# Unit: s   Range: 0.0..2.0
# How long tracking must hold valid again after a brief loss before
# motion resumes. Avoids resuming on a single recovered frame.
recovery_stability_s         = 0.10
# Runtime tunable: yes
# Freeze desired_target_pose_ during loss instead of integrating from
# stale hand data. Strongly recommended.
freeze_target_on_loss        = true
# Runtime tunable: yes
# Re-anchor the gesture reference (capture new hand pose, set robot
# active-entry pose = last commanded target) on recovery so accumulated
# hand motion during the dropout does NOT cause a jump.
reanchor_on_recovery         = true
# Runtime tunable: yes
# Hard-zero the velocity-filter state on recovery so the robot resumes
# from rest. Combined with the soft caps below this is the second line
# of defence against post-recovery jumps.
reset_velocity_on_recovery   = true
# Runtime tunable: yes
# During the hold, drive filtered velocity to zero via the existing
# ramp_to_zero machinery (amovel-only - NO speedl, NO stopMotion).
ramp_to_zero_on_loss         = true
# Runtime tunable: yes
# After brief_loss_timeout_s the SM is allowed to FAULT as before.
fault_after_timeout          = true
# Runtime tunable: yes
# When true, recovery from a brief loss requires the operator to remove
# and re-present hands (legacy strict behaviour). Default false: smooth
# automatic resume.
require_recenter_after_brief_loss = false
# Runtime tunable: yes
# Unit: mm  Range: 0.0..50.0
# Step cap (Euclidean norm) used for the first recovery_soft_commands
# amovels after a brief-loss recovery. Smaller = softer resume.
max_recovery_step_xyz_mm     = 2.0
# Runtime tunable: yes
# Unit: deg Range: 0.0..20.0
max_recovery_step_rot_deg    = 0.5
# Runtime tunable: yes
# Range: 0..100
# Number of consecutive amovels after recovery that use the soft caps
# above. Each successful send decrements the counter.
recovery_soft_commands       = 3


# =============================================================================
# [runtime_tuning]
# Hot-reload: when enabled, the program watches this .ini for changes and
# applies whitelisted parameters live. Disable to behave exactly like before.
# =============================================================================
[runtime_tuning]
# Runtime tunable: no  (toggling at runtime would race with the watcher)
enabled = false
# Runtime tunable: no
watch_config_file = true
# Runtime tunable: no
# Unit: ms  Range: 100..5000
poll_interval_ms = 500
# Runtime tunable: no
print_changes_to_console = true
log_changes_to_event_file = true
# When true, ignore non-whitelisted edits (safest).
apply_only_whitelisted_parameters = true
# When true, reject out-of-range values (safer; keeps the prior value).
reject_invalid_values = true


# =============================================================================
# [logging]
# Optional CSV + event log of every tick. The motion CSV is the primary
# tool for diagnosing residual jerkiness. Disable for zero overhead.
# =============================================================================
[logging]
# Runtime tunable: yes
enabled = false
# Runtime tunable: yes  (filename rolls over only when the experiment
# name or directory actually changes between two reloads)
log_directory = logs
experiment_name = default_test
# Runtime tunable: yes
motion_csv_enabled = true
event_log_enabled  = true
# Runtime tunable: yes
# Unit: -   Range: 1..10000
# Higher = less disk I/O overhead, more risk of losing samples on crash.
flush_every_n_samples = 20
# Runtime tunable: yes
# When true, motion CSV records ONLY while the controller is actively
# streaming (PositionControl / OrientationControl / ramp-to-zero tail).
# Set false to also record passive ticks (useful for tracking-only debugging).
log_only_when_active = true
# Runtime tunable: yes
# When true, include the last cached actual robot pose in each CSV row.
# Pose is NEVER fetched while active (alarm 5.7056 root cause), so this is
# the most-recent reading captured during a passive window.
include_robot_actual_pose = true


# =============================================================================
# [debug]
# Compact periodic console summary independent of the full ConsoleUI render.
# Useful for tuning sessions without opening the CSV.
# =============================================================================
[debug]
# Runtime tunable: yes
print_motion_summary  = false
# Runtime tunable: yes
# Unit: s   Range: 0.1..60.0
summary_period_s      = 1.0
# Runtime tunable: yes
# Verbose per-amovel log line. Off by default - generates a lot of noise.
verbose_robot_commands = false


# =============================================================================
# [workspace]  (optional safety envelope)
# When enabled, the controller clamps motion to a box around the safe pose.
# Disabled for bring-up - the operator walks the cell first.
# =============================================================================
workspace.enabled  = false
workspace.x_min    = -300.0
workspace.x_max    = 400.0
workspace.y_min    = 200.0
workspace.y_max    = 600.0
workspace.z_min    = 150.0
workspace.z_max    = 600.0
workspace.rx_range = 45.0
workspace.ry_range = 45.0
workspace.rz_range = 90.0


# =============================================================================
# [safe_pose]   (robot base frame)
# Pose used on startup, on recovery, and as orientation reference.
# X, Y, Z in mm; Rx, Ry, Rz in deg (Doosan ZYZ' = W,P,R).
# =============================================================================
safe_pose.x   = 55.0
safe_pose.y   = 400.0
safe_pose.z   = 375.0
safe_pose.rx  = 33.0
safe_pose.ry  = 96.0
safe_pose.rz  = 110.0


# =============================================================================
# [control_loop]   (master tick rate + hard safety caps)
# =============================================================================
loop.rate_hz         = 60
robot.max_lin_speed  = 120.0
robot.max_ang_speed  = 28.0
robot.max_lin_accel  = 650.0
robot.max_ang_accel  = 160.0


# =============================================================================
# [tool]   (Doosan TCP + Tool Weight selection)
# Both objects MUST already exist on the Doosan controller, created via
# the teach pendant or DART (Setting -> Robot -> Tool/TCP). This program
# ONLY applies the configured names; it does NOT create or modify any
# TCP / Tool Weight entry. Empty name = skip.
# =============================================================================
[tool]
# Runtime tunable: no  (applied once at engage())
# When false, neither TCP nor Tool Weight is touched at startup.
apply_on_start    = true
# Runtime tunable: no
# Exact name of the TCP entry on the controller. Leave empty to skip.
tcp_name          = QB_SoftHand_Industry_GraspCenter
# Runtime tunable: no
# Exact name of the Tool Weight entry on the controller. Leave empty to skip.
tool_weight_name  = QB_SoftHand_Industry_Assembly


# =============================================================================
# [gripper]   (vendor-agnostic, optional)
# When enabled = false, NoopGripper is selected and the demo behaves
# exactly as if no gripper were attached - no SDK / library is required
# to build or run. When enabled = true, the backend listed below is
# instantiated. Gripper commands are EVENT-DRIVEN (impulse open/close on
# gesture), not 60 Hz, so the motion loop is never blocked.
# =============================================================================
[gripper]
# Runtime tunable: no
enabled              = false
# Runtime tunable: no
# Informative tag. Recognised values: "qb_softhand_industry", "tool_io".
type                 = qb_softhand_industry
# Runtime tunable: no
# Selects the actual implementation:
#   "none"                  - NoopGripper (no I/O, logs only)
#   "tool_io"               - existing DRFL tool DO impulses
#   "qb_softhand_industry"  - vendor STUB (logs commands; no vendor SDK linked)
backend              = none

# Future qbRobotics UDP/API settings (loaded but ignored by the stub).
ip                   = 192.168.1.110
open_position        = 0
close_position       = 100
pregrasp_position    = 40
close_speed_percent  = 50
close_force_percent  = 75
command_timeout_s    = 1.5
wait_for_target      = false

# --- Legacy tool-DO + two-hand gesture parameters --------------------
# Used only when backend = tool_io. Preserved so the historical
# ToolIoGripperController integration keeps working unchanged.
gripper.distance_open_mm   = 170.0
gripper.distance_close_mm  = 50.0
gripper.neutral_min_mm     = 80.0
gripper.neutral_max_mm     = 140.0
gripper.facing_dot_max     = -0.5
gripper.cooldown_s         = 0.8
gripper.gesture_hold_s     = 0.25
gripper.open_do_index      = 2
gripper.close_do_index     = 1


# =============================================================================
# [external_button]   ("keyboard" or "gpio")
# =============================================================================
button.mode         = keyboard
button.keyboard_key = SPACE


# =============================================================================
# [ui]
# =============================================================================
ui.clear_screen_each_tick = true
ui.show_hand_debug        = false


# =============================================================================
# [log]   (text Logger - separate from the structured motion/event loggers)
# =============================================================================
log.level = INFO
log.file  = doosan_gesture_demo.log


# =============================================================================
# [dry_run]   (smoke-test flags)
# =============================================================================
dryrun.robot   = false
dryrun.gripper = false


# =============================================================================
# Legacy incremental-mode caps. Only used when [micro_pursuit] enabled = false.
# =============================================================================
robot.micro_max_delta_xyz_mm   = 22.0
robot.micro_max_delta_rot_deg  = 4.0
robot.micro_deadband_mm        = 0.5
robot.micro_deadband_deg       = 0.3

# =============================================================================
# Doosan Gesture Demo - runtime configuration
# All units: mm, mm/s, deg, deg/s, seconds. Angles as extrinsic XYZ Euler.
# Tuned for open-house safety first. See docs/TUNING_GUIDE.md.
# =============================================================================

# --- Robot network -----------------------------------------------------------
robot.ip              = 192.168.137.100
robot.port            = 12345
robot.model           = A0912
# Fail-safe: refuse to start if robot does not connect within this many seconds.
robot.connect_timeout_s = 5.0

# --- Control loop ------------------------------------------------------------
loop.rate_hz          = 60
# Upper bound on commanded TCP linear velocity (mm/s) in any axis.
robot.max_lin_speed   = 120.0
# Upper bound on commanded TCP angular velocity (deg/s) in any axis.
robot.max_ang_speed   = 25.0
# Upper bound on commanded TCP linear acceleration (mm/s^2).
robot.max_lin_accel   = 400.0
# Upper bound on commanded TCP angular acceleration (deg/s^2).
robot.max_ang_accel   = 120.0

# --- Demo workspace envelope (robot base frame, mm) --------------------------
# Small bounded cube centred on the safe pose. Used by WorkspaceGuard.
workspace.x_min       = 300.0
workspace.x_max       = 600.0
workspace.y_min       = -200.0
workspace.y_max       = 200.0
workspace.z_min       = 150.0
workspace.z_max       = 450.0
# Orientation cone (deg): allowed deviation of TCP Rx/Ry/Rz from the safe pose.
workspace.rx_range    = 30.0
workspace.ry_range    = 30.0
workspace.rz_range    = 60.0

# --- Safe / home pose (robot base frame) -------------------------------------
# Pose used on startup, on recovery, and as orientation reference.
# X, Y, Z (mm), Rx, Ry, Rz (deg) - Doosan convention.
safe_pose.x           = 450.0
safe_pose.y           = 0.0
safe_pose.z           = 300.0
safe_pose.rx          = 0.0
safe_pose.ry          = 180.0
safe_pose.rz          = 0.0

# --- Gesture thresholds (Leap grab_strength 0..1) ----------------------------
# Hysteresis prevents chattering between open/closed detection.
gesture.grab_closed_threshold = 0.85
gesture.grab_open_threshold   = 0.30
# Minimum confidence reported by Leap for a hand sample to be trusted.
gesture.min_confidence        = 0.3
# How long (s) a hand must be missing before we consider it lost.
gesture.hand_loss_timeout_s   = 0.15
# Debounce: posture must be held this long before triggering state entry.
gesture.posture_hold_s        = 0.10

# --- Motion mapping ----------------------------------------------------------
# Scale: mm of robot displacement per mm of hand displacement (position mode).
motion.position_scale         = 0.8
# Scale: deg of TCP rotation per deg of hand rotation (orientation mode).
motion.orientation_scale      = 0.6
# Dead-zone on hand displacement before any motion is commanded (mm).
motion.position_deadzone_mm   = 2.5
# Dead-zone on hand rotation before orientation motion (deg).
motion.orientation_deadzone_deg = 2.0
# Exponential smoothing factor (0 = no smoothing, 1 = infinite smoothing).
# Keep low so motion feels immediate.
motion.smoothing_alpha        = 0.25
# Axis sign flips for venue calibration. +1 or -1.
motion.sign_x = 1
motion.sign_y = 1
motion.sign_z = 1
motion.sign_rx = 1
motion.sign_ry = 1
motion.sign_rz = 1

# --- Gripper gesture ---------------------------------------------------------
gripper.distance_open_mm   = 170.0
gripper.distance_close_mm  = 50.0
# Neutral band: must re-enter this band between commands to re-arm (mm).
gripper.neutral_min_mm     = 80.0
gripper.neutral_max_mm     = 140.0
# Palm-normal dot product threshold for "hands facing each other".
# Hands facing means dot(left.normal, right.normal) < this value (negative).
gripper.facing_dot_max     = -0.5
# Cool-down between any two gripper impulses (seconds).
gripper.cooldown_s         = 0.8
# Time the two-hand facing posture must be held before gripper gesture arms.
gripper.gesture_hold_s     = 0.25

# --- External start button ---------------------------------------------------
# "keyboard" (SPACE toggles) or "gpio" (not implemented in this skeleton).
button.mode = keyboard
button.keyboard_key = SPACE

# --- UI ----------------------------------------------------------------------
ui.clear_screen_each_tick = true
ui.show_hand_debug        = false

# --- Logging -----------------------------------------------------------------
log.level = INFO
log.file  = doosan_gesture_demo.log

# --- Test / dry-run flags ----------------------------------------------------
# When true, robot adapter accepts commands but does not send anything.
# Useful for demo rehearsal with the sensor only.
dryrun.robot  = false
# When true, gripper commands are logged but not sent.
dryrun.gripper = false

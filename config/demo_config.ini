# =============================================================================
# Doosan Gesture Demo - runtime configuration
# All units: mm, mm/s, deg, deg/s, seconds. Angles as extrinsic XYZ Euler.
# Tuned for open-house safety first. See docs/TUNING_GUIDE.md.
# =============================================================================

# --- Robot network -----------------------------------------------------------
robot.ip              = 192.168.1.2
robot.port            = 12345
robot.model           = A0509
# Fail-safe: refuse to start if robot does not connect within this many seconds.
robot.connect_timeout_s = 5.0
# When true, skip the initial blocking movel-to-safe-pose. Set this if the
# controller trips a SAFE_STOP during the home approach (e.g. the safe pose
# is inside a controller-side safety zone, or the move triggers collision
# detection). The demo then operates from whatever pose the robot is in.
robot.skip_move_home = false
# Collision detection sensitivity (0..100). 0 disables - use for bring-up
# when gentle motions trip phantom collision stops because the payload/TCP
# isn't yet declared on the controller. Re-enable (50-75) for production.
robot.collision_sensitivity = 0
# Singularity handling for movel / speedl. Maps to the Doosan
# SINGULARITY_AVOIDANCE enum:
#   0 = AVOID  (blend through; demo default)
#   1 = STOP   (controller default - this is what trips alarm 3205)
#   2 = VEL    (reduce velocity near singularity)
robot.singularity_handling = 0
# Use joint-space movejx instead of Cartesian movel for the initial home
# approach. movejx is immune to Cartesian path singularities; recommended
# for the safe-pose move.
robot.home_use_movejx = true
# Auto-reset latched safety stops (SAFE_STOP / SAFE_OFF) at the start of
# each engage(). A SAFE_STOP from a previous run stays latched on the
# controller and blocks the next servo_on, which looks identical to a
# "mastering lost" symptom. DRFL cannot bypass real mastering loss
# (firmware-level check) - that one needs the pendant Setting -> Robot
# -> Mastering menu.
robot.auto_reset_safety = true

# --- Control loop ------------------------------------------------------------
loop.rate_hz          = 60
# Bring-up profile: extremely gentle so any residual safety supervisor
# trigger is on geometry, not on dynamics. Tune up once the cell is
# characterised. See docs/TUNING_GUIDE.md.
# Upper bound on commanded TCP linear velocity (mm/s) in any axis.
robot.max_lin_speed   = 15.0
# Upper bound on commanded TCP angular velocity (deg/s) in any axis.
robot.max_ang_speed   = 2.0
# Upper bound on commanded TCP linear acceleration (mm/s^2).
robot.max_lin_accel   = 50.0
# Upper bound on commanded TCP angular acceleration (deg/s^2).
robot.max_ang_accel   = 10.0

# --- Demo workspace envelope (robot base frame, mm) --------------------------
# When workspace.enabled = false the envelope is NOT enforced - only the hard
# speed / acceleration caps below still apply. Enable + tune the box once the
# operator has walked the cell.
workspace.enabled     = false
workspace.x_min       = -300.0
workspace.x_max       = 400.0
workspace.y_min       = 200.0
workspace.y_max       = 600.0
workspace.z_min       = 150.0
workspace.z_max       = 600.0
# Orientation cone (deg): allowed deviation of TCP Rx/Ry/Rz from the safe pose.
workspace.rx_range    = 45.0
workspace.ry_range    = 45.0
workspace.rz_range    = 90.0

# --- Safe / home pose (robot base frame) -------------------------------------
# Pose used on startup, on recovery, and as orientation reference.
# X, Y, Z   in mm
# Rx, Ry, Rz in deg, with the Doosan V3.5 convention:
#   rx == W  (rotation about Z, first)
#   ry == P  (rotation about Y', second)
#   rz == R  (rotation about Z'', third)        --> ZYZ' intrinsic Euler
# These correspond directly to what the teach pendant shows as
# "posx [x, y, z, W, P, R]" and are what DRFL movel / movejx consume.
safe_pose.x           = 55.0
safe_pose.y           = 400.0
safe_pose.z           = 375.0
safe_pose.rx          = 33.0
safe_pose.ry          = 96.0
safe_pose.rz          = 110.0

# --- Gesture thresholds (Leap grab_strength 0..1) ----------------------------
# Hysteresis prevents chattering between open/closed detection.
gesture.grab_closed_threshold = 0.85
gesture.grab_open_threshold   = 0.30
# Minimum confidence reported by Leap for a hand sample to be trusted.
gesture.min_confidence        = 0.3
# How long (s) a hand must be missing before we consider it lost.
gesture.hand_loss_timeout_s   = 0.15
# Debounce: posture must be held this long before triggering state entry.
gesture.posture_hold_s        = 0.10

# --- Motion mapping ----------------------------------------------------------
# Scale: mm of robot displacement per mm of hand displacement (position mode).
# Bring-up: keep low so the robot feels deliberate. Tune up to ~0.8 later.
motion.position_scale         = 0.05
# Scale: deg of TCP rotation per deg of hand rotation (orientation mode).
motion.orientation_scale      = 0.03
# Dead-zone on hand displacement before any motion is commanded (mm).
motion.position_deadzone_mm   = 2.5
# Dead-zone on hand rotation before orientation motion (deg).
motion.orientation_deadzone_deg = 2.0
# Exponential smoothing factor (0 = no smoothing, 1 = infinite smoothing).
# Keep low so motion feels immediate.
motion.smoothing_alpha        = 0.25
# Axis sign flips for venue calibration. +1 or -1.
motion.sign_x = 1
motion.sign_y = 1
motion.sign_z = 1
motion.sign_rx = 1
motion.sign_ry = 1
motion.sign_rz = 1

# --- Gripper gesture ---------------------------------------------------------
# Generic two-state gripper driven via the controller's tool DO. Wire whichever
# end-effector you have (Schunk, Robotiq, OnRobot, custom) to the DO indices
# used by ToolIoGripperController.
gripper.distance_open_mm   = 170.0
gripper.distance_close_mm  = 50.0
# Neutral band: must re-enter this band between commands to re-arm (mm).
gripper.neutral_min_mm     = 80.0
gripper.neutral_max_mm     = 140.0
# Palm-normal dot product threshold for "hands facing each other".
# Hands facing means dot(left.normal, right.normal) < this value (negative).
gripper.facing_dot_max     = -0.5
# Cool-down between any two gripper impulses (seconds).
gripper.cooldown_s         = 0.8
# Time the two-hand facing posture must be held before gripper gesture arms.
gripper.gesture_hold_s     = 0.25
# Tool DO channel indices on the Doosan controller (1-based). Match your wiring.
gripper.open_do_index      = 2
gripper.close_do_index     = 1

# --- External start button ---------------------------------------------------
# "keyboard" (SPACE toggles) or "gpio" (not implemented in this skeleton).
button.mode = keyboard
button.keyboard_key = SPACE

# --- UI ----------------------------------------------------------------------
ui.clear_screen_each_tick = true
ui.show_hand_debug        = false

# --- Logging -----------------------------------------------------------------
log.level = INFO
log.file  = doosan_gesture_demo.log

# --- Test / dry-run flags ----------------------------------------------------
# When true, robot adapter accepts commands but does not send anything.
# Useful for demo rehearsal with the sensor only.
dryrun.robot  = false
# When true, gripper commands are logged but not sent.
dryrun.gripper = false

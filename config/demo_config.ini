# =============================================================================
# Doosan Gesture Demo - runtime configuration
# All units: mm, mm/s, deg, deg/s, seconds. Angles as extrinsic XYZ Euler.
# Tuned for open-house safety first. See docs/TUNING_GUIDE.md.
# =============================================================================

# --- Robot network -----------------------------------------------------------
robot.ip              = 192.168.1.2
robot.port            = 12345
robot.model           = A0509
# Fail-safe: refuse to start if robot does not connect within this many seconds.
robot.connect_timeout_s = 5.0

# --- Control loop ------------------------------------------------------------
loop.rate_hz          = 60
# Upper bound on commanded TCP linear velocity (mm/s) in any axis.
robot.max_lin_speed   = 120.0
# Upper bound on commanded TCP angular velocity (deg/s) in any axis.
robot.max_ang_speed   = 25.0
# Upper bound on commanded TCP linear acceleration (mm/s^2).
robot.max_lin_accel   = 400.0
# Upper bound on commanded TCP angular acceleration (deg/s^2).
robot.max_ang_accel   = 120.0

# --- Demo workspace envelope (robot base frame, mm) --------------------------
# When workspace.enabled = false the envelope is NOT enforced - only the hard
# speed / acceleration caps below still apply. Enable + tune the box once the
# operator has walked the cell.
workspace.enabled     = false
workspace.x_min       = -300.0
workspace.x_max       = 400.0
workspace.y_min       = 200.0
workspace.y_max       = 600.0
workspace.z_min       = 150.0
workspace.z_max       = 600.0
# Orientation cone (deg): allowed deviation of TCP Rx/Ry/Rz from the safe pose.
workspace.rx_range    = 45.0
workspace.ry_range    = 45.0
workspace.rz_range    = 90.0

# --- Safe / home pose (robot base frame) -------------------------------------
# Pose used on startup, on recovery, and as orientation reference.
# X, Y, Z (mm), Rx, Ry, Rz (deg) - Doosan convention (BASE frame).
safe_pose.x           = 55.0
safe_pose.y           = 400.0
safe_pose.z           = 375.0
safe_pose.rx          = 33.0
safe_pose.ry          = 96.0
safe_pose.rz          = 110.0

# --- Gesture thresholds (Leap grab_strength 0..1) ----------------------------
# Hysteresis prevents chattering between open/closed detection.
gesture.grab_closed_threshold = 0.85
gesture.grab_open_threshold   = 0.30
# Minimum confidence reported by Leap for a hand sample to be trusted.
gesture.min_confidence        = 0.3
# How long (s) a hand must be missing before we consider it lost.
gesture.hand_loss_timeout_s   = 0.15
# Debounce: posture must be held this long before triggering state entry.
gesture.posture_hold_s        = 0.10

# --- Motion mapping ----------------------------------------------------------
# Scale: mm of robot displacement per mm of hand displacement (position mode).
motion.position_scale         = 0.8
# Scale: deg of TCP rotation per deg of hand rotation (orientation mode).
motion.orientation_scale      = 0.6
# Dead-zone on hand displacement before any motion is commanded (mm).
motion.position_deadzone_mm   = 2.5
# Dead-zone on hand rotation before orientation motion (deg).
motion.orientation_deadzone_deg = 2.0
# Exponential smoothing factor (0 = no smoothing, 1 = infinite smoothing).
# Keep low so motion feels immediate.
motion.smoothing_alpha        = 0.25
# Axis sign flips for venue calibration. +1 or -1.
motion.sign_x = 1
motion.sign_y = 1
motion.sign_z = 1
motion.sign_rx = 1
motion.sign_ry = 1
motion.sign_rz = 1

# --- Gripper gesture ---------------------------------------------------------
# Generic two-state gripper driven via the controller's tool DO. Wire whichever
# end-effector you have (Schunk, Robotiq, OnRobot, custom) to the DO indices
# used by ToolIoGripperController.
gripper.distance_open_mm   = 170.0
gripper.distance_close_mm  = 50.0
# Neutral band: must re-enter this band between commands to re-arm (mm).
gripper.neutral_min_mm     = 80.0
gripper.neutral_max_mm     = 140.0
# Palm-normal dot product threshold for "hands facing each other".
# Hands facing means dot(left.normal, right.normal) < this value (negative).
gripper.facing_dot_max     = -0.5
# Cool-down between any two gripper impulses (seconds).
gripper.cooldown_s         = 0.8
# Time the two-hand facing posture must be held before gripper gesture arms.
gripper.gesture_hold_s     = 0.25
# Tool DO channel indices on the Doosan controller (1-based). Match your wiring.
gripper.open_do_index      = 2
gripper.close_do_index     = 1

# --- External start button ---------------------------------------------------
# "keyboard" (SPACE toggles) or "gpio" (not implemented in this skeleton).
button.mode = keyboard
button.keyboard_key = SPACE

# --- UI ----------------------------------------------------------------------
ui.clear_screen_each_tick = true
ui.show_hand_debug        = false

# --- Logging -----------------------------------------------------------------
log.level = INFO
log.file  = doosan_gesture_demo.log

# --- Test / dry-run flags ----------------------------------------------------
# When true, robot adapter accepts commands but does not send anything.
# Useful for demo rehearsal with the sensor only.
dryrun.robot  = false
# When true, gripper commands are logged but not sent.
dryrun.gripper = false

# =============================================================================
# Gripper backend selection (PC-side qbRobotics SoftClaw integration)
#
# The SoftClaw is connected DIRECTLY TO THIS PC via the qbRobotics
# USB / RS-485 adapter. The Doosan controller is NOT involved in
# gripper control:
#   - no Doosan tool digital outputs are used
#   - no qbGrippers Write Signals in the Doosan Task Editor are used
#   - the Doosan controller plugin/module is NOT required
#
# Commands are issued by this process directly through the qbRobotics
# C API (https://github.com/NMMI/qbAPI).
#
# See docs/SOFTCLAW_INTEGRATION.md for SDK download, COM port discovery
# on Windows, and troubleshooting.
# =============================================================================

# Master enable. When false, NoopGripper is selected and the demo runs
# unchanged with no I/O on the COM port.
gripper.enabled = true

# Selected gripper kind. Recognised values:
#   softclaw / qb_softclaw  - qbRobotics SoftClaw (PC-side)
#   (anything else)         - falls back to NoopGripper
gripper.type = softclaw

# Selected backend. Recognised values:
#   qb_sdk   - PC-side qbRobotics SDK (qbAPI). Used when type = softclaw.
#   tool_io  - legacy DRFL tool digital-output path (uses the
#              gripper.*_do_index keys above). Not used for SoftClaw.
#   none     - NoopGripper (no I/O)
gripper.backend = qb_sdk

# Windows COM port where the qbRobotics USB / RS-485 adapter appears.
# Find it in Device Manager -> Ports (COM & LPT). Typical: COM3..COM6.
gripper.port = COM3

# qbRobotics device id on the bus. Default factory id is 1.
gripper.device_id = 1

# Baud rate used by openRS485. The qbAPI Windows default is 2 000 000.
gripper.baudrate = 2000000

# When false, an initialization failure falls back to NoopGripper and the
# demo still runs without the gripper. When true, startup aborts.
gripper.required = false

# Initialize the SoftClaw at application startup (open serial, ping,
# activate motor). Set to false to skip the qbAPI handshake (useful
# during rehearsal without the gripper plugged in).
gripper.initialize_on_startup = true

# Optional one-shot OPEN at startup so the demo always begins from a
# known gripper state. Default = false so we never grab anything on launch.
gripper.open_on_startup = false

# Deactivate the qbmove motor on application shutdown so the SoftClaw
# does not keep holding torque between sessions.
gripper.stop_on_exit = true

# Command values passed to qbAPI commSetInputs(short int inputs[2]).
# inputs[0] = motor position (encoder ticks),
# inputs[1] = stiffness / deflection (encoder ticks).
# Tune per device after observing safe ranges in qb's official tools.
gripper.open_position    = 0
gripper.close_position   = 19000
gripper.open_deflection  = 0
gripper.close_deflection = 15000

# Bus protection: minimum interval between two SoftClaw serial writes.
# Prevents flooding the RS-485 link during continuous gesture control.
gripper.min_command_period_ms = 30

# Suppress a fresh serial write when the new (position, deflection) is
# within this absolute change on BOTH axes vs the last command.
gripper.command_deadband = 50

# Timeout for SDK / serial operations (ms). The qbAPI is non-blocking
# for write paths; this value is the budget for read-back operations
# (e.g. commPing during initialize).
gripper.command_timeout_ms = 100

# =============================================================================
# Doosan Open-House Gesture Demo - runtime configuration
#
# Layout:
#   1. QUICK TUNING       - knobs touched often during field tuning.
#   2. SAFETY / LIMITS    - safety, control loop, workspace, safe pose.
#   3. ADVANCED           - orientation knobs, optional / disabled-by-default
#                           features (velocity_filter, tool TCP, runtime_tuning,
#                           logging, debug, gripper advanced).
#
# Notes for editors:
#   - The parser is flat-key with section-prefix folding (see Config.cpp
#     aliases). A given [section] header may appear MORE THAN ONCE: keys
#     under either occurrence accumulate into the same flat map. We use
#     that to keep "Quick" orientation-agnostic keys at the top and the
#     orientation-specific keys grouped under "Advanced".
#   - Units: mm, mm/s, deg, deg/s, mm/s^2, deg/s^2, seconds. Angles use
#     the Doosan ZYZ' (W, P, R) convention - same numbers the pendant
#     shows for posx [x, y, z, W, P, R].
# =============================================================================


# =============================================================================
# 1. QUICK TUNING
# =============================================================================


# -----------------------------------------------------------------------------
# [robot_connection] - link to the Doosan controller. STARTUP-only.
# -----------------------------------------------------------------------------
[robot_connection]
ip                       = 192.168.1.25
port                     = 12345
model                    = M1013
connect_timeout_s        = 5.0

# DEMO-SAFE DEFAULTS: false. The robot does NOT auto-move on its own.
# Effective home rule: move_home = return_home_on_start AND NOT skip_move_home.
return_home_on_start     = false
return_home_on_shutdown  = false
skip_move_home           = false


# -----------------------------------------------------------------------------
# [motion_smoothing] - EMA on the raw Leap palm samples (gesture layer).
# Higher = smoother but laggier. Useful values: 0.1 .. 0.3.
# -----------------------------------------------------------------------------
[motion_smoothing]
smoothing_alpha          = 0.18


# -----------------------------------------------------------------------------
# [micro_pursuit] - high-level pursuit/lookahead Cartesian controller.
# Quick-tuning XYZ-side keys live here; the orientation-side keys are in the
# Advanced block at the bottom of the file.
# -----------------------------------------------------------------------------
[micro_pursuit]
# Master enable. When false: legacy incremental integrator (kept for A/B).
enabled                  = true
# Effective hand->robot gain in pursuit mode (multiplied by motion.position_scale).
hand_to_robot_ratio      = 0.50
# Slew-rate cap on desired_target_pose_ XYZ between two ticks.
# Effective per-tick cap (mm) = target_change_ratio * lin_vel * T_emit
# (T_emit = max(min_period_s, 1 / command_rate_hz)).
# Lower = smoother / less catch-up jitter. Higher = more responsive.
target_change_ratio      = 0.70
# Pursuit step caps (Euclidean XYZ norm; never per-axis).
min_step_xyz_mm          = 0.8
max_step_xyz_mm          = 8.0
# Below this XYZ error norm the controller commits to "arrived".
arrival_band_xyz_mm      = 1.5
# Time tracking must remain valid before re-arming pursuit (cold start).
tracking_recovery_time_s = 0.05


# -----------------------------------------------------------------------------
# [robot_command] - per-amovel motion profile + scheduler.
# -----------------------------------------------------------------------------
[robot_command]
# Higher = more reactive, more DRFL traffic. Backlog guard keeps pacing safe.
micro_command_rate_hz    = 10.0
# Hard lower bound between consecutive amovel calls.
micro_min_period_s       = 0.10
# Per-segment velocity / acceleration caps (linear).
micro_lin_vel            = 100.0
micro_lin_acc            = 500.0
# Backlog guard. The scheduler estimates the previous segment execution
# time with a physical accel-aware model (triangular for short segments,
# trapezoidal for long ones) and refuses to enqueue the next amovel
# until at least min_motion_completion_ratio of that estimate has elapsed.
prevent_command_backlog     = true
min_motion_completion_ratio = 0.55
max_pending_command_age_s   = 0.35


# -----------------------------------------------------------------------------
# [blending] - inter-segment blending for chained amovels.
# -----------------------------------------------------------------------------
[blending]
enabled                  = true
radius_mm                = 3.2
type                     = duplicate


# -----------------------------------------------------------------------------
# [motion_mapping] - hand-to-robot mapping (XYZ part).
# Orientation knobs are in the Advanced block at the bottom.
# -----------------------------------------------------------------------------
[motion_mapping]
position_scale           = 0.90
position_deadzone_mm     = 1.5
# Axis sign flips for venue calibration. +1 or -1.
sign_x                   = 1
sign_y                   = 1
sign_z                   = 1


# -----------------------------------------------------------------------------
# [leap] - Leap Motion (Gemini 6.2.0) gesture detection thresholds.
# -----------------------------------------------------------------------------
[leap]
min_confidence           = 0.3
hand_loss_timeout_s      = 0.15
posture_hold_s           = 0.10
grab_closed_threshold    = 0.85
grab_open_threshold      = 0.30


# -----------------------------------------------------------------------------
# [tracking_loss_tolerance] - brief Leap dropout handling.
# -----------------------------------------------------------------------------
[tracking_loss_tolerance]
enabled                           = true
frame_timeout_s                   = 0.15
brief_loss_timeout_s              = 0.50
recovery_stability_s              = 0.10
freeze_target_on_loss             = true
reanchor_on_recovery              = true
reset_velocity_on_recovery        = true
ramp_to_zero_on_loss              = true
max_recovery_step_xyz_mm          = 2.0
recovery_soft_commands            = 3


# -----------------------------------------------------------------------------
# [gripper] - qb SoftHand wired to the Doosan CONTROLLER digital outputs
# (NOT the tool flange). Drive pulses on O01 (open) and O02 (close).
# -----------------------------------------------------------------------------
[gripper]
enabled                  = true
# Selected implementation: "tool_io" routes through DigitalIoGripperController.
backend                  = tool_io
# IO routing inside DigitalIoGripperController:
#   "controller" -> robot_.setControllerDigitalOutput()  (GPIO_CTRLBOX_*)
#   "tool"       -> robot_.setToolDigitalOutput()        (GPIO_TOOL_*)
io_scope                 = controller
# 1-based pendant index. Wiring on this cell: O01 = open, O02 = close.
open_do_index            = 1
close_do_index           = 2
# Pulse HIGH duration (ms). Clamped to a 50 ms floor in code.
pulse_high_ms            = 1000
# Optional bring-up test pulse (no Leap, no gesture).
test_pulse_on_start      = false
test_pulse_index         = 1


# =============================================================================
# 2. SAFETY / LIMITS
# =============================================================================


# -----------------------------------------------------------------------------
# [safety] - controller-level safety knobs. STARTUP-only.
# -----------------------------------------------------------------------------
[safety]
collision_sensitivity    = 0
singularity_handling     = 0
home_use_movejx          = true
auto_reset_safety        = true


# -----------------------------------------------------------------------------
# Control loop + global motion caps. Flat keys, no section header needed
# because each key carries its own namespace prefix.
# -----------------------------------------------------------------------------
loop.rate_hz             = 60
robot.max_lin_speed      = 120.0
robot.max_ang_speed      = 28.0
robot.max_lin_accel      = 650.0
robot.max_ang_accel      = 160.0


# -----------------------------------------------------------------------------
# Workspace envelope (robot base frame). Disabled for bring-up.
# -----------------------------------------------------------------------------
workspace.enabled        = false
workspace.x_min          = -300.0
workspace.x_max          = 400.0
workspace.y_min          = 200.0
workspace.y_max          = 600.0
workspace.z_min          = 150.0
workspace.z_max          = 600.0
workspace.rx_range       = 45.0
workspace.ry_range       = 45.0
workspace.rz_range       = 90.0


# -----------------------------------------------------------------------------
# Safe / home pose (robot base frame, mm and Doosan ZYZ' deg).
# -----------------------------------------------------------------------------
safe_pose.x              = 55.0
safe_pose.y              = 400.0
safe_pose.z              = 375.0
safe_pose.rx             = 33.0
safe_pose.ry             = 96.0
safe_pose.rz             = 110.0


# =============================================================================
# 3. ADVANCED / OPTIONAL / DISABLED BY DEFAULT
# =============================================================================


# -----------------------------------------------------------------------------
# Orientation / Advanced
# Orientation tuning is rarely touched once calibrated. Keys live in
# their natural sections (re-opened here) so the parser keeps working
# unchanged.
# -----------------------------------------------------------------------------
[motion_mapping]
orientation_scale        = 0.45
orientation_deadzone_deg = 1.5
sign_rx                  = 1
sign_ry                  = 1
sign_rz                  = 1

[micro_pursuit]
min_step_rot_deg         = 0.5
max_step_rot_deg         = 2.5
arrival_band_rot_deg     = 0.7

[robot_command]
micro_ang_vel            = 22.0
micro_ang_acc            = 120.0


# -----------------------------------------------------------------------------
# [velocity_filter] - LPF + accel/jerk-limited velocity smoothing layer.
# Disabled by default in this branch (the bare pursuit step path is the
# field default). Re-enable for A/B testing of the smoother feel.
# -----------------------------------------------------------------------------
[velocity_filter]
enabled                  = false
alpha                    = 0.25
max_jerk_xyz             = 1500.0
max_jerk_rot             = 400.0
deadband_mm_s            = 1.5
stop_ramp_time_s         = 0.22


# -----------------------------------------------------------------------------
# [tool] - apply an existing TCP / Tool Weight by name. Disabled by
# default; the entries must already exist on the controller (this
# program NEVER creates / modifies them).
# -----------------------------------------------------------------------------
[tool]
apply_on_start           = false
tcp_name                 = QB_SoftHand_Industry_GraspCenter
tool_weight_name         = QB_SoftHand_Industry_Assembly


# -----------------------------------------------------------------------------
# [runtime_tuning] - hot-reload of selected parameters from this file.
# Disabled by default so a fresh deployment behaves identically to a
# single-load run.
# -----------------------------------------------------------------------------
[runtime_tuning]
enabled                              = false
watch_config_file                    = true
poll_interval_ms                     = 500
print_changes_to_console             = true
log_changes_to_event_file            = true
apply_only_whitelisted_parameters    = true
reject_invalid_values                = true


# -----------------------------------------------------------------------------
# [logging] - structured motion CSV + event log. Disabled by default.
# -----------------------------------------------------------------------------
[logging]
enabled                  = false
log_directory            = logs
experiment_name          = default_test
motion_csv_enabled       = true
event_log_enabled        = true
flush_every_n_samples    = 20
log_only_when_active     = true
include_robot_actual_pose = true


# -----------------------------------------------------------------------------
# [debug] - compact periodic console summary independent of the UI.
# -----------------------------------------------------------------------------
[debug]
print_motion_summary     = false
summary_period_s         = 1.0
verbose_robot_commands   = false


# -----------------------------------------------------------------------------
# Gripper advanced / vendor-specific.
# The vendor-stub fields here are loaded for forwards-compat with
# QbSoftHandIndustryGripper but are NOT used by the tool_io / controller
# I/O path. Keep them as documentation hooks.
# Two-hand gesture thresholds (distance / facing / cool-down) are also
# here because they are tuned once at venue setup, not at every run.
# -----------------------------------------------------------------------------
[gripper]
type                       = qb_softhand_industry
ip                         = 192.168.1.110
open_position              = 0
close_position             = 100
pregrasp_position          = 40
close_speed_percent        = 50
close_force_percent        = 75
command_timeout_s          = 1.5
wait_for_target            = false

# Two-hand gesture thresholds (flat-key form). CLOSE fires when the
# inter-palm distance falls below distance_close_mm; OPEN fires above
# distance_open_mm; the operator must pass through the neutral band.
gripper.distance_close_mm  = 90.0
gripper.distance_open_mm   = 180.0
gripper.neutral_min_mm     = 100.0
gripper.neutral_max_mm     = 160.0
gripper.facing_dot_max     = -0.5
gripper.cooldown_s         = 0.8
gripper.gesture_hold_s     = 0.25


# -----------------------------------------------------------------------------
# External button + UI + textual logger. Rarely touched.
# -----------------------------------------------------------------------------
button.mode              = keyboard
button.keyboard_key      = SPACE

ui.clear_screen_each_tick = true
ui.show_hand_debug       = false

log.level                = INFO
log.file                 = doosan_gesture_demo.log


# -----------------------------------------------------------------------------
# Dry-run toggles. Useful for rehearsal with the sensor only.
# -----------------------------------------------------------------------------
dryrun.robot             = false
dryrun.gripper           = false


# -----------------------------------------------------------------------------
# Legacy incremental-mode caps. Only used when [micro_pursuit].enabled = false.
# -----------------------------------------------------------------------------
robot.micro_max_delta_xyz_mm   = 22.0
robot.micro_max_delta_rot_deg  = 4.0
robot.micro_deadband_mm        = 0.5
robot.micro_deadband_deg       = 0.3
